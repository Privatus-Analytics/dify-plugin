identity:
  name: get_timeseries
  author: privatus-analytics
  label:
    en_US: Get Visitors Over Time
description:
  human:
    en_US: Gets visitors, visits and pageviews for each day (or hour, week, month) of a period, ready for a chart.
  llm: Gets the metrics of a website per time bucket (visitors, visits, pageviews, views per visit, bounce rate, visit duration, revenue) for a period. Use it to see trends.
parameters:
- name: site
  type: string
  required: true
  label:
    en_US: Site
  human_description:
    en_US: The site ID (like pa_7Q2K9XH3AB) or its domain (like example.com).
  llm_description: The site to read. Either the site ID that starts with pa_ or the domain of the site, like example.com. Use list_sites to find them.
  form: llm
- name: period
  type: select
  required: false
  label:
    en_US: Period
  human_description:
    en_US: Which dates to look at. Pick Custom dates to set your own start and end.
  llm_description: 'Date range preset in the site''s timezone: today, yesterday, 24h, 7d, 14d, 28d, 30d, 90d, mtd, last_month, qtd, last_quarter, ytd, 12mo, last_year, all, or custom (then also give date_from and date_to).'
  form: llm
  default: 30d
  options:
  - value: today
    label:
      en_US: Today
  - value: yesterday
    label:
      en_US: Yesterday
  - value: 24h
    label:
      en_US: Last 24 hours
  - value: 7d
    label:
      en_US: Last 7 days
  - value: 14d
    label:
      en_US: Last 14 days
  - value: 28d
    label:
      en_US: Last 28 days
  - value: 30d
    label:
      en_US: Last 30 days
  - value: 90d
    label:
      en_US: Last 90 days
  - value: mtd
    label:
      en_US: Month to date
  - value: last_month
    label:
      en_US: Last month
  - value: qtd
    label:
      en_US: Quarter to date
  - value: last_quarter
    label:
      en_US: Last quarter
  - value: ytd
    label:
      en_US: Year to date
  - value: 12mo
    label:
      en_US: Last 12 months
  - value: last_year
    label:
      en_US: Last year
  - value: all
    label:
      en_US: All time
  - value: custom
    label:
      en_US: Custom dates
- name: date_from
  type: string
  required: false
  label:
    en_US: Start date
  human_description:
    en_US: First day for Custom dates, as YYYY-MM-DD.
  llm_description: First day of the range as YYYY-MM-DD. Only used when period is custom.
  form: llm
- name: date_to
  type: string
  required: false
  label:
    en_US: End date
  human_description:
    en_US: Last day for Custom dates, as YYYY-MM-DD. This day is included.
  llm_description: Last day of the range as YYYY-MM-DD, inclusive. Only used when period is custom.
  form: llm
- name: interval
  type: select
  required: false
  label:
    en_US: Step
  human_description:
    en_US: How long each point is. Auto picks one for the period.
  llm_description: 'Bucket size: auto, hour, day, week or month.'
  form: llm
  default: auto
  options:
  - value: auto
    label:
      en_US: Auto
  - value: hour
    label:
      en_US: Hour
  - value: day
    label:
      en_US: Day
  - value: week
    label:
      en_US: Week
  - value: month
    label:
      en_US: Month
extra:
  python:
    source: tools/get_timeseries.py
