identity:
  name: get_stats
  author: privatus-analytics
  label:
    en_US: Get Stats
description:
  human:
    en_US: Gets visitors, visits, pageviews, bounce rate and visit time for a site, and how they changed.
  llm: 'Gets the headline numbers of a website for a period: visitors, visits, pageviews, views per visit, bounce rate (percent), visit duration and revenue. Can compare with the period before or the year before and returns the percent change.'
parameters:
- name: site
  type: string
  required: true
  label:
    en_US: Site
  human_description:
    en_US: The site ID (like pa_7Q2K9XH3AB) or its domain (like example.com).
  llm_description: The site to read. Either the site ID that starts with pa_ or the domain of the site, like example.com. Use list_sites to find them.
  form: llm
- name: period
  type: select
  required: false
  label:
    en_US: Period
  human_description:
    en_US: Which dates to look at. Pick Custom dates to set your own start and end.
  llm_description: 'Date range preset in the site''s timezone: today, yesterday, 24h, 7d, 14d, 28d, 30d, 90d, mtd, last_month, qtd, last_quarter, ytd, 12mo, last_year, all, or custom (then also give date_from and date_to).'
  form: llm
  default: 30d
  options:
  - value: today
    label:
      en_US: Today
  - value: yesterday
    label:
      en_US: Yesterday
  - value: 24h
    label:
      en_US: Last 24 hours
  - value: 7d
    label:
      en_US: Last 7 days
  - value: 14d
    label:
      en_US: Last 14 days
  - value: 28d
    label:
      en_US: Last 28 days
  - value: 30d
    label:
      en_US: Last 30 days
  - value: 90d
    label:
      en_US: Last 90 days
  - value: mtd
    label:
      en_US: Month to date
  - value: last_month
    label:
      en_US: Last month
  - value: qtd
    label:
      en_US: Quarter to date
  - value: last_quarter
    label:
      en_US: Last quarter
  - value: ytd
    label:
      en_US: Year to date
  - value: 12mo
    label:
      en_US: Last 12 months
  - value: last_year
    label:
      en_US: Last year
  - value: all
    label:
      en_US: All time
  - value: custom
    label:
      en_US: Custom dates
- name: date_from
  type: string
  required: false
  label:
    en_US: Start date
  human_description:
    en_US: First day for Custom dates, as YYYY-MM-DD.
  llm_description: First day of the range as YYYY-MM-DD. Only used when period is custom.
  form: llm
- name: date_to
  type: string
  required: false
  label:
    en_US: End date
  human_description:
    en_US: Last day for Custom dates, as YYYY-MM-DD. This day is included.
  llm_description: Last day of the range as YYYY-MM-DD, inclusive. Only used when period is custom.
  form: llm
- name: compare
  type: select
  required: false
  label:
    en_US: Compare with
  human_description:
    en_US: Also show the numbers for an earlier period and the change.
  llm_description: 'Comparison: none, previous_period (same length right before) or previous_year.'
  form: llm
  default: previous_period
  options:
  - value: none
    label:
      en_US: No comparison
  - value: previous_period
    label:
      en_US: The period before
  - value: previous_year
    label:
      en_US: The same dates last year
extra:
  python:
    source: tools/get_stats.py
